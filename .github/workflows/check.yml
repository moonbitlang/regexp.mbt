on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install-ubuntu
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: install-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: moon check
        run: |
          moon check --deny-warn --target all

      - name: moon test
        run: |
          moon test --target all
          moon test README.mbt.md --target all

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code

  unicode-generator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Unicode data
        run: bash prebuild/download.sh
      - name: Check generator and regenerate tables
        run: |
          moon -C prebuild update
          moon -C prebuild check --target native --deny-warn
          moon -C prebuild run --target native src -- "$GITHUB_WORKSPACE/prebuild/data" "$GITHUB_WORKSPACE/internal/unicode"
          moon -C prebuild info
          moon -C prebuild fmt
          git diff --exit-code
